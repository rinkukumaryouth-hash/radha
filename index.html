<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Radha : The Innocent Girl</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#17110e;color:#e7d9c9;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:20px}
  .w{width:min(1050px,100%);display:flex;flex-direction:column;gap:14px}
  header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  h1{margin:0;font-size:22px}
  h1 b{color:#c98a5e}
  .pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:#f5c04a}
  .grid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
  @media(max-width:860px){.grid{grid-template-columns:1fr}}
  .stage{position:relative;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
  .stage video{width:100%;height:100%;object-fit:cover;display:block}
  .badge{position:absolute;left:13px;top:13px;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.45);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600}
  .tp{background:rgba(34,26,22,.75);border:1px solid rgba(255,255,255,.08);border-radius:14px;display:flex;flex-direction:column;max-height:540px;min-height:300px;overflow:hidden}
  .tp h2{margin:0;padding:11px 15px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#a89a8c;border-bottom:1px solid rgba(255,255,255,.08)}
  .lines{padding:13px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;flex:1;font-size:14px}
  .u{align-self:flex-end;background:#c98a5e;color:#17110e;padding:8px 12px;border-radius:13px;max-width:86%;line-height:1.45}
  .r{align-self:flex-start;background:rgba(255,255,255,.09);padding:8px 12px;border-radius:13px;max-width:86%;line-height:1.45}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  button{border:0;border-radius:999px;padding:11px 19px;font-size:14px;font-weight:600;cursor:pointer;background:#c98a5e;color:#17110e}
  button.g{background:rgba(255,255,255,.08);color:#e7d9c9}
  button:disabled{opacity:.45;cursor:not-allowed}
  .msg{border-radius:9px;padding:9px 12px;font-size:13px;line-height:1.5;display:none}
  .err{background:rgba(255,80,80,.12);color:#ffb3b3;border:1px solid rgba(255,80,80,.35)}
  .warn{background:rgba(201,138,94,.14);color:#e0c3a6;border:1px solid rgba(201,138,94,.4)}
  details{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:9px 13px}
  summary{cursor:pointer;font-size:13px;color:#a89a8c}
  .f{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}
  @media(max-width:700px){.f{grid-template-columns:1fr}}
  .f label{display:block;font-size:11px;color:#a89a8c;margin-bottom:3px}
  .f input{width:100%;padding:7px 9px;border-radius:7px;background:#0d0b0a;color:#e7d9c9;border:1px solid rgba(255,255,255,.12);font-family:ui-monospace,Menlo,monospace;font-size:12px}
</style>
</head>
<body>
<div class="w">
  <header>
    <h1>Radha <b>:</b> The Innocent Girl</h1>
    <span class="pill"><span class="dot" id="d"></span><span id="st">Ready</span></span>
  </header>

  <div class="grid">
    <section style="display:flex;flex-direction:column;gap:12px">
      <div class="stage">
        <video id="v" src="https://github.com/rinkukumaryouth-hash/radha/releases/download/avatar-v1/radha.mp4" muted loop playsinline preload="auto"></video>
        <audio id="a" autoplay></audio>
        <div class="badge"><span class="dot" id="d2"></span>Radha</div>
      </div>
      <div id="e" class="msg err"></div>
      <div class="bar">
        <button id="call">▶ Call Radha</button>
        <button id="mute" class="g" disabled>Mute</button>
        <button id="end" class="g" disabled>End</button>
      </div>
    </section>

    <aside class="tp"><h2>Transcript</h2><div class="lines" id="L"></div></aside>
  </div>

  <details id="set">
    <summary>Settings — Sarvam keys (browser mein hi rehti hain)</summary>
    <div class="f">
      <div><label>Sarvam API key</label><input id="k3" /></div>
      <div><label>Sarvam org id</label><input id="k4" /></div>
      <div><label>Sarvam workspace id</label><input id="k5" /></div>
      <div><label>Sarvam app id</label><input id="k6" /></div>
    </div>
    <div class="bar" style="margin-top:10px"><button id="save" class="g">Save</button></div>
  </details>
</div>

<script type="module">
import { ConversationAgent, BrowserAudioInterface, InteractionType, AgentState } from "https://cdn.jsdelivr.net/npm/sarvam-conv-ai-sdk@0.0.42/+esm";

const D = {
  k3: "",
  k4: "019f48af-6eaf-7b13-ba20-679bc10903c4",
  k5: "019f48af-6eb6-7642-be56-bc4e7bc080ed",
  k6: "Conversatio-18b58ac3-e3c3",
};
const $ = (i) => document.getElementById(i);
const v = $("v");
let S = { ...D };
try { const s = JSON.parse(localStorage.getItem("radha2") || "null"); if (s) S = { ...S, ...s }; } catch {}
for (const k in D) $(k).value = S[k] || "";
$("save").onclick = () => { for (const k in D) S[k] = $(k).value.trim(); localStorage.setItem("radha2", JSON.stringify(S)); st("Saved"); };

const st = (t, c) => { $("st").textContent = t; $("d").style.background = c || "#f5c04a"; $("d2").style.background = c || "#f5c04a"; };
const en = (i, o) => { $(i).disabled = !o; };
const err = (t) => { $("e").style.display = t ? "block" : "none"; $("e").textContent = t || ""; };

function line(role, txt) {
  txt = (txt || "").trim(); if (!txt) return;
  const L = $("L"), last = L.lastElementChild;
  if (last && last.dataset.r === role) last.textContent = txt;
  else { const d = document.createElement("div"); d.className = role === "user" ? "u" : "r"; d.dataset.r = role; d.textContent = txt; L.appendChild(d); }
  L.scrollTop = L.scrollHeight;
}

// The face is a short clip of Radha: it plays while she speaks and holds still
// while she listens. Sound comes from Sarvam, so the clip is muted.
const play = () => { v.play().catch(() => {}); };
const hold = () => { try { v.pause(); } catch {} };

let ag = null, muted = false;

async function call() {
  err("");
  if (!S.k3 || !S.k4 || !S.k5 || !S.k6) { $("set").open = true; return err("Sarvam key/ids missing — Settings kholiye."); }
  en("call", false); st("Connecting…");
  try {
    const ai = new BrowserAudioInterface(16000, { outputGain: 1 });   // no avatar engine — the SDK plays the voice
    ag = new ConversationAgent({
      apiKey: S.k3,
      config: {
        org_id: S.k4, workspace_id: S.k5, app_id: S.k6,
        user_identifier: "radha-web", user_identifier_type: "custom",
        interaction_type: InteractionType.CALL, input_sample_rate: 16000, output_sample_rate: 16000,
      },
      audioInterface: ai,
      audioCallback: async () => {},
      transcriptCallback: async (m) => line(m.role === "user" ? "user" : "radha", m.content),
      stateCallback: (s) => {
        if (s === AgentState.CONNECTING) { st("Connecting…"); hold(); }
        else if (s === AgentState.CONNECTED || s === AgentState.LISTENING) { st("Sun rahi hai…", "#43d17f"); hold(); }
        else if (s === AgentState.SPEAKING) { st("Radha bol rahi hai…", "#c98a5e"); play(); }
        else if (s === AgentState.IDLE) { st("Ready"); hold(); }
        else if (s === AgentState.ERROR) { st("Error", "#ff5050"); hold(); }
      },
      endCallback: async () => stop(),
    });
    await ag.start(); await ag.waitForConnect(10);
    en("mute", true); en("end", true);
  } catch (e) { err(e && e.message ? e.message : String(e)); st("Error", "#ff5050"); stop(); }
}

function stop() {
  try { ag && ag.stop(); } catch {}
  ag = null; hold();
  try { v.currentTime = 0; } catch {}
  muted = false; $("mute").textContent = "Mute";
  en("call", true); en("mute", false); en("end", false); st("Ready");
}

$("call").onclick = call;
$("end").onclick = stop;
$("mute").onclick = () => { if (!ag) return; muted = !muted; muted ? ag.mute() : ag.unmute(); $("mute").textContent = muted ? "Unmute" : "Mute"; };

v.addEventListener("error", () => err("Avatar clip load nahi hua (internet check kijiye)."));

if (!S.k3) {
  $("set").open = true;
  const e = $("e"); e.className = "msg warn"; e.style.display = "block";
  e.textContent = "Pehli baar: Settings mein apni Sarvam API key daaliye (sirf ek baar — browser yaad rakhega).";
}
</script>
</body>
</html>
